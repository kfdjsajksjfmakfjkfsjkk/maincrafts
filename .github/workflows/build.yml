name: Build Tornado Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        shell: bash
        run: ./gradlew build

      - name: Show generated JARs
        shell: bash
        run: |
          echo "JARs generados:"
          ls -lh build/libs || true

      - name: Check mods.toml inside JAR
        shell: bash
        run: |
          shopt -s nullglob
          for jar in build/libs/tornadomod-*.jar; do
            echo ""
            echo "===== INSPECCIONANDO: $jar ====="
            unzip -l "$jar" | head -n 120
            echo ""
            echo "===== META-INF/mods.toml ====="
            unzip -p "$jar" META-INF/mods.toml || echo "FALTA META-INF/mods.toml"
          done

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tornadomod-${{ github.run_number }}
          path: build/libs/tornadomod-*.jar
          if-no-files-found: error
