name: Build Tornado Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Gradle wrapper files
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: falta gradlew en la raiz del repo"
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: falta gradle/wrapper/gradle-wrapper.jar"
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: falta gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

      - name: Fix gradlew CRLF and permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Show generated JARs
        run: |
          echo "JARs generados:"
          ls -lh build/libs || true

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tornadomod-${{ github.run_number }}
          path: build/libs/tornadomod-*.jar
          if-no-files-found: error
